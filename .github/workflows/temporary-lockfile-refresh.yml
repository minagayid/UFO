name: Temporary lockfile refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh:
    name: Generate and validate dependency lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Regenerate lockfile for declared dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply non-breaking security updates to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
        continue-on-error: true
      - name: Verify clean installation
        run: npm ci --ignore-scripts
        continue-on-error: true
      - name: Capture remaining audit findings
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - name: Upload generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
