name: Temporary lockfile refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    name: Generate, audit, and commit dependency lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Regenerate lockfile for declared dependencies
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply non-breaking security updates to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify clean installation
        run: npm ci --ignore-scripts
      - name: Enforce dependency audit gate
        run: npm audit --audit-level=moderate
      - name: Commit regenerated lockfile
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "fix(deps): update lockfile to audited versions"
          git push origin "HEAD:${BRANCH_NAME}"
