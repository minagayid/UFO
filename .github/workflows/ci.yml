name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write
  checks: write

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run dependency audit
        id: dependency-audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - name: Check for sensitive data
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # Let the action select the correct base/head for push and pull_request events.
          # Explicit default-branch/HEAD inputs made pushes to main compare a commit to itself.
      - name: Enforce dependency audit gate
        if: steps.dependency-audit.outcome == 'failure'
        run: |
          echo "Dependency audit found vulnerabilities at or above the configured threshold."
          exit 1

  build:
    name: Build Application
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run TypeScript check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node-version }}
          path: dist
          retention-days: 5

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check for console logs
        run: |
          if grep -r "console\\." src/ --include="*.tsx" --include="*.ts" | grep -v "// console\\." | grep -v "console\\.error"; then
            echo "Warning: console statements found in source code"
          fi
      - name: Check for TODO/FIXME comments
        run: |
          echo "=== TODOs in source code ==="
          grep -r "TODO\\|FIXME" src/ --include="*.tsx" --include="*.ts" || echo "None found"

  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Check outdated dependencies
        run: |
          npm ci
          npm outdated || true

  readiness:
    name: Documentation Hygiene
    runs-on: ubuntu-latest
    needs: [build, lint, security]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check README
        run: |
          if [ ! -f README.md ] || [ ! -s README.md ]; then
            echo "README.md is missing or empty"
            exit 1
          fi
          if ! grep -q "Installation\\|Setup\\|Usage" README.md; then
            echo "README.md lacks key sections"
          fi
      - name: Check LICENSE
        run: |
          if [ ! -f LICENSE ]; then
            echo "No LICENSE file found"
          fi
      - name: Check CONTRIBUTING guidelines
        run: |
          if [ ! -f CONTRIBUTING.md ]; then
            echo "Consider adding CONTRIBUTING.md"
          fi
      - name: Summary
        run: |
          echo "Required CI gates passed."
          echo "This workflow does not independently authorize a production deployment."
