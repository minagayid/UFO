name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write
  checks: write

jobs:
  # Security: Check for vulnerable dependencies
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        run: |
          cd frontend
          npm install
          npm audit --audit-level=moderate || npm audit fix --force
        continue-on-error: true

      - name: Check for sensitive data
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # Build: Verify the frontend builds successfully
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run TypeScript check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node-version }}
          path: frontend/dist
          retention-days: 5

  # Code Quality: Lint and format checks
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Check for console logs
        run: |
          cd frontend
          if grep -r "console\." src/ --include="*.tsx" --include="*.ts" | grep -v "// console\." | grep -v "console\.error"; then
            echo "Warning: console statements found in source code"
          fi

      - name: Check for TODO/FIXME comments
        run: |
          cd frontend
          echo "=== TODOs in source code ==="
          grep -r "TODO\|FIXME" src/ --include="*.tsx" --include="*.ts" || echo "None found"

  # Dependencies: Check for outdated packages
  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Check outdated dependencies
        run: |
          cd frontend
          npm install
          npm outdated || true

  # Production readiness check
  readiness:
    name: Production Readiness
    runs-on: ubuntu-latest
    needs: [build, lint, security]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Check README
        run: |
          if [ ! -f README.md ] || [ ! -s README.md ]; then
            echo "❌ README.md is missing or empty"
            exit 1
          fi
          
          if ! grep -q "Installation\|Setup\|Usage" README.md; then
            echo "⚠️ README.md lacks key sections"
          fi

      - name: Check LICENSE
        run: |
          if [ ! -f LICENSE ]; then
            echo "⚠️ No LICENSE file found"
          fi

      - name: Check CONTRIBUTING guidelines
        run: |
          if [ ! -f CONTRIBUTING.md ]; then
            echo "ℹ️ Consider adding CONTRIBUTING.md"
          fi

      - name: Summary
        run: |
          echo "✅ All CI checks passed!"
          echo "Ready for deployment"
